name: ${DOCKER_DEV_NAME}

services:
  express:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    volumes:
      - ../../:/app
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      # PostgreSQL Connection Variables
      PGUSER: ${DOCKER_DEV_POSTGRES_DB_USER}
      PGPASSWORD: ${DOCKER_DEV_POSTGRES_DB_PASSWORD}
      PGHOST: postgres_db
      PGPORT: 5432
      PGDATABASE: ${DOCKER_DEV_POSTGRES_DB_NAME}
    ports:
      - '${DOCKER_DEV_EXPRESS_PORT}:5000'
    command: bash -c "npm install && npm start"
    init: true
    depends_on:
      postgres_db:
        condition: service_healthy
  
  postgres_db:
    image: postgres:18-alpine
    volumes:
      - postgres_db_data:/var/lib/postgresql/data/
      - ../../alevines.sql:/docker-entrypoint-initdb.d/init.sql 
    environment:
      - POSTGRES_DB=${DOCKER_DEV_POSTGRES_DB_NAME}
      - POSTGRES_USER=${DOCKER_DEV_POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${DOCKER_DEV_POSTGRES_DB_PASSWORD}
      - TZ=America/Mexico_City
    ports:
      - "${DOCKER_DEV_POSTGRES_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_db_data: