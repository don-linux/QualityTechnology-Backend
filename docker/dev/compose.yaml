name: ${DOCKER_DEV_NAME}

services:
  express:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ../../:/app
      - node_modules:/app/node_modules
    environment:
      PGUSER: ${DOCKER_DEV_POSTGRES_DB_USER}
      PGPASSWORD: ${DOCKER_DEV_POSTGRES_DB_PASSWORD}
      PGHOST: postgres_db
      PGPORT: 5432
      PGDATABASE: ${DOCKER_DEV_POSTGRES_DB_NAME}
      DATABASE_URL: postgresql://${DOCKER_DEV_POSTGRES_DB_USER}:${DOCKER_DEV_POSTGRES_DB_PASSWORD}@postgres_db:5432/${DOCKER_DEV_POSTGRES_DB_NAME}
    ports:
      - '${DOCKER_DEV_EXPRESS_PORT}:5000'
    command: bash -c "npm install && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run dev"
    init: true
    depends_on:
      postgres_db:
        condition: service_healthy
  
  postgres_db:
    image: postgres:18.3-alpine3.23
    volumes:
      - postgres_db_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DOCKER_DEV_POSTGRES_DB_NAME}
      - POSTGRES_USER=${DOCKER_DEV_POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${DOCKER_DEV_POSTGRES_DB_PASSWORD}
      - TZ=America/Mexico_City
    ports:
      - "${DOCKER_DEV_POSTGRES_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_db_data:
  node_modules: