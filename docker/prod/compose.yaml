name: ${DOCKER_PROD_NAME}

services:
  express:
    build:
      context: ../../
      dockerfile: docker/prod/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '${DOCKER_PROD_EXPRESS_PORT}:5000'
    volumes:
      - express_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:5000/').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    init: true
    restart: unless-stopped

volumes:
  express_uploads: