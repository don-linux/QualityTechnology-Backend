name: ${DOCKER_PROD_NAME}

services:
  express:
    build:
      context: ../../
      dockerfile: docker/prod/Dockerfile
    volumes:
      - ../../:/app
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '${DOCKER_PROD_EXPRESS_PORT}:5000'
    command: bash -c "bun install --frozen-lockfile || bun install && bun run start"
    init: true