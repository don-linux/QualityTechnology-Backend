openapi: 3.0.0
info:
  title: "QualityTechnology API"
  version: "1.0.0"
  description: |
    Documentación en español de la API REST de QualityTechnology.
    Incluye rutas, parámetros, cuerpos de petición y esquemas inferidos
    a partir del código del proyecto. Los esquemas usan la notación
    húngara del proyecto (fc_ = string, fi_ = integer, fd_ = date/datetime, fn_ = number).

servers:
  - url: https://api.qualitytechnology.com
    description: Servidor de producción
  - url: https://staging-api.qualitytechnology.com
    description: Servidor de staging
  - url: http://localhost:5000
    description: Servidor de desarrollo (local)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    Role:
      type: object
      description: "Representa un rol de usuario"
      properties:
        fi_rol_id:
          type: integer
        fc_nombre:
          type: string
      required: [fc_nombre]

    Usuario:
      type: object
      properties:
        fi_usuario_id:
          type: integer
        fc_nombre:
          type: string
        fi_rol_id:
          type: integer

    UsuarioCreate:
      type: object
      properties:
        nombre:
          type: string
        contraseña:
          type: string
        rol_id:
          type: integer
        fc_nombre_empleado:
          type: string
          description: "Requerido para roles no-root; crea el perfil de empleado vinculado."
        fc_apellido_paterno:
          type: string
        fc_apellido_materno:
          type: string
        fi_departamento_id:
          type: integer
        fi_puesto_id:
          type: integer
        fi_unidad_negocio_id:
          type: integer
      required: [nombre, contraseña, rol_id]

    UsuarioLoginRequest:
      type: object
      properties:
        nombre:
          type: string
        contraseña:
          type: string
      required: [nombre, contraseña]

    UsuarioLoginResponse:
      type: object
      properties:
        mensaje:
          type: string
        token:
          type: string
          description: "Access token JWT (expira en 8h)"
        refreshToken:
          type: string
          description: "Refresh token (expira en 7 días, usar en POST /usuarios/refresh)"
        usuario:
          type: object
          properties:
            id:
              type: integer
            nombre:
              type: string
            rol:
              type: string
        modulos:
          type: array
          description: "Módulos disponibles para el rol del usuario"
          items:
            type: object
            properties:
              fi_modulo_id:
                type: integer
              fc_nombre:
                type: string
              fc_ruta:
                type: string
              fb_activo:
                type: boolean

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    RefreshTokenResponse:
      type: object
      properties:
        mensaje:
          type: string
        token:
          type: string
        refreshToken:
          type: string
        modulos:
          type: array
          items:
            type: object
            properties:
              fi_modulo_id:
                type: integer
              fc_nombre:
                type: string
              fc_ruta:
                type: string
              fb_activo:
                type: boolean

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    Pileta:
      type: object
      properties:
        fi_pileta_id:
          type: integer
        cantidad:
          type: number
        talla_gr:
          type: number
        fi_lote_id:
          type: integer
        no_lote:
          type: string
        observacion:
          type: string
        fecha_siembra:
          type: string
          format: date
        fecha_ultima_biometria:
          type: string
          format: date
        dias_en_pila:
          type: number
        dias_transcurridos:
          type: number
        nombre_instalacion:
          type: string
        fc_granja:
          type: string

    Lote:
      type: object
      properties:
        fi_lote_id:
          type: integer
        no_lote:
          type: string
        alevines_inicial:
          type: integer
        fecha:
          type: string
          format: date
        fi_instalacion_id:
          type: integer
        fc_granja:
          type: string
        familia:
          type: string
        huevos_ml:
          type: number
          description: "Numérico con decimales. Longitud máxima del valor enviado: 15 caracteres."
        observacion:
          type: string
          maxLength: 500

    Reproductor:
      type: object
      properties:
        fi_reproductor_id:
          type: integer
        fc_instalacion:
          type: string
        fn_cantidad:
          type: number
        fn_talla:
          type: number
          description: "Numérico con decimales. Longitud máxima del valor enviado: 15 caracteres."
        fn_machos:
          type: integer
          description: "Entero. Longitud máxima del valor enviado: 15 caracteres."
        fn_hembras:
          type: integer
          description: "Entero. Longitud máxima del valor enviado: 15 caracteres."
        fc_ratio:
          type: string
        fc_linea:
          type: string
        fc_familia:
          type: string
        fc_observacion:
          type: string
          maxLength: 500
        fd_fecha_siembra:
          type: string
          format: date
        fd_fecha_biometria:
          type: string
          format: date
        dias_en_pila:
          type: number

    Engorda:
      type: object
      properties:
        fi_engorda_id:
          type: integer
        fi_instalacion_id:
          type: integer
        destino_nombre:
          type: string
        fi_lote_id:
          type: integer
        no_lote:
          type: string
        cantidad:
          type: number
        talla_gr:
          type: number
        observacion:
          type: string
          maxLength: 500
        fecha_siembra:
          type: string
          format: date
        fecha_biometria:
          type: string
          format: date
        dias_en_pila:
          type: number
        dias_transcurridos:
          type: number
        fi_usuario_id:
          type: integer
        fc_granja:
          type: string

    Empleado:
      type: object
      properties:
        fi_empleado_id:
          type: integer
        fc_nombre:
          type: string
        fc_apellido_paterno:
          type: string
        fc_apellido_materno:
          type: string
        fc_genero:
          type: string
        fc_calle:
          type: string
        fc_cp:
          type: string
        fc_referencia:
          type: string
        fc_comentarios:
          type: string
        fi_usuario_id:
          type: integer
        fi_puesto_id:
          type: integer
        fi_departamento_id:
          type: integer
        fi_unidad_negocio_id:
          type: integer
        unidad_negocio_nombre:
          type: string
        fi_ciudad_id:
          type: integer
        fi_estado_id:
          type: integer
        fi_edad:
          type: integer
        fd_fecha_nacimiento:
          type: string
          format: date
        fd_fecha_contratacion:
          type: string
          format: date
        fd_fecha_baja:
          type: string
          format: date

    DocumentoEmpleado:
      type: object
      properties:
        fi_documento_id:
          type: integer
        fi_empleado_id:
          type: integer
        fi_tipo_documento_id:
          type: integer
        fc_ruta_archivo:
          type: string
        fc_nombre_original:
          type: string
        fd_fecha_carga:
          type: string
          format: date
        tipo_nombre:
          type: string
        fb_obligatorio:
          type: boolean

    ActaAdministrativa:
      type: object
      properties:
        fi_acta_id:
          type: integer
        fi_empleado_id:
          type: integer
        fc_motivo:
          type: string
        fd_fecha:
          type: string
          format: date
        fc_ruta_archivo:
          type: string
        fc_nombre_original:
          type: string

    Cliente:
      type: object
      properties:
        fi_cliente_id:
          type: integer
        fc_razon_social:
          type: string
        fc_rfc:
          type: string
          maxLength: 20
        fi_unidad_negocio_id:
          type: integer
        unidad_negocio_nombre:
          type: string
          readOnly: true
        fc_nombre_contacto:
          type: string
        fc_telefono:
          type: string
          pattern: '^[0-9]{1,10}$'
        fc_correo:
          type: string
          format: email
        fc_localidad:
          type: string
        fc_estado:
          type: string
        fi_ejecutivo_empleado_id:
          type: integer
        ejecutivo_nombre:
          type: string
          readOnly: true
        fi_usuario_id:
          type: integer
      required:
        - fc_razon_social
        - fc_rfc
        - fi_unidad_negocio_id
        - fc_nombre_contacto
        - fc_telefono
        - fc_correo
        - fc_localidad
        - fc_estado
        - fi_ejecutivo_empleado_id

    Venta:
      type: object
      properties:
        fi_venta_id:
          type: integer
        fc_folio:
          type: string
        fd_fecha_venta:
          type: string
          format: date
        fc_cliente:
          type: string
        fc_tipo_venta:
          type: string
        fn_cantidad_vendida:
          type: number
        fn_precio_venta:
          type: number
        fn_monto_total:
          type: number
        fn_abonado:
          type: number
        fn_adeudo:
          type: number
        fc_estado_pago:
          type: string
        fc_encargado_venta:
          type: string
        fc_observaciones:
          type: string
        fc_empresa:
          type: string

    ListaEspera:
      type: object
      properties:
        fi_lista_id:
          type: integer
        fd_fecha_entrega:
          type: string
          format: date
        fn_cantidad:
          type: number
        fc_cliente:
          type: string
        fc_lugar_entrega:
          type: string
        fc_encargado_venta:
          type: string
        fc_unidad_produccion:
          type: string
        fc_hora_embolsado:
          type: string
        fc_hora_entrega:
          type: string
        fn_precio_venta:
          type: number
        fc_uap_asignada:
          type: string
        fc_granja_asignada:
          type: string
        pileta_origen_id:
          type: integer
        nombre_pileta_origen:
          type: string

    Equipo:
      type: object
      properties:
        fi_equipo_id:
          type: integer
        fc_nombre:
          type: string
        fc_marca:
          type: string
        fc_modelo:
          type: string
        fc_tipo:
          type: string
        fd_fecha_compra:
          type: string
          format: date
        fn_costo:
          type: number
        fc_estado:
          type: string
        fc_ubicacion:
          type: string
        fc_responsable:
          type: string
        fd_proximo_mantenimiento:
          type: string
          format: date
        fc_notas:
          type: string
        fi_usuario_id:
          type: integer

    Mantenimiento:
      type: object
      properties:
        fi_mantenimiento_id:
          type: integer
        fi_equipo_id:
          type: integer
        fd_fecha:
          type: string
          format: date
        fc_tipo:
          type: string
        fc_responsable:
          type: string
        fc_descripcion:
          type: string
        fn_costo:
          type: number
        fc_estado_post:
          type: string
        fd_proximo_mantenimiento:
          type: string
          format: date

    Expediente:
      type: object
      description: "Entidad dinámica para expedientes. Los campos pueden variar."
      additionalProperties: true

    Nomina:
      type: object
      properties:
        fi_nomina_id:
          type: integer
        fc_nombre_empleado:
          type: string
        fi_empleado_id:
          type: integer
        fd_fecha_pago:
          type: string
          format: date
        fn_total:
          type: number
        fn_bono:
          type: number
        fn_deuda:
          type: number
        fn_descuento:
          type: number
        fn_anticipo:
          type: number
        fi_usuario_id:
          type: integer

    Vacacion:
      type: object
      properties:
        fi_vacacion_id:
          type: integer
        fc_nombre_empleado:
          type: string
        fi_empleado_id:
          type: integer
        fc_departamento:
          type: string
        fd_inicio_periodo:
          type: string
          format: date
        fd_fin_periodo:
          type: string
          format: date

    CajaAhorroResumen:
      type: object
      properties:
        id:
          type: integer
        categoria:
          type: string
        granja:
          type: string

    Proveedor:
      type: object
      required:
        - fc_razon_social
        - fc_rfc
        - fc_producto_servicio
        - fi_unidad_negocio_id
        - fc_nombre_contacto
        - fc_telefono
        - fc_correo
        - fc_localidad
        - fc_estado
      properties:
        fi_proveedor_id:
          type: integer
        fc_razon_social:
          type: string
        fc_rfc:
          type: string
          maxLength: 20
        fc_producto_servicio:
          type: string
        fi_unidad_negocio_id:
          type: integer
        unidad_negocio_nombre:
          type: string
        fc_nombre_contacto:
          type: string
        fc_telefono:
          type: string
          maxLength: 10
        fc_correo:
          type: string
          format: email
        fc_localidad:
          type: string
        fc_estado:
          type: string

    FlujoCajaMovimiento:
      type: object
      properties:
        fi_movimiento_id:
          type: integer
        fc_granja:
          type: string
        fd_fecha:
          type: string
          format: date
        fn_ingreso:
          type: number
        fn_egreso:
          type: number
        fc_observaciones:
          type: string
        fc_cuenta:
          type: string
        fc_categoria:
          type: string
        fc_subcategoria:
          type: string
        fc_beneficiario:
          type: string
        fc_noproyecto:
          type: string
        fc_factura:
          type: string
        fc_estatus:
          type: string
        fc_mes:
          type: string
        fi_venta_id:
          type: integer
          nullable: true

    TesoreriaOverview:
      type: object
      properties:
        anio:
          type: integer
        periodo:
          type: integer
        mes_nombre:
          type: string
        fc_granja:
          type: string
        grupo:
          type: string
        subgrupo:
          type: string
        categoria:
          type: string
        total_ingreso:
          type: number
        total_egreso:
          type: number
        saldo_neto:
          type: number

    Cuenta:
      type: object
      properties:
        fi_cuenta_id:
          type: integer
        fc_udn:
          type: string
          maxLength: 100
        fc_nombre:
          type: string
        fc_numero_cuenta:
          type: string
          nullable: true
        fc_banco:
          type: string
          nullable: true
          maxLength: 150
        fc_tipo:
          type: string
          enum: [Cheques, Efectivo, Inversion, Ahorro]
        fn_saldo_actual:
          type: number
          format: double
        fb_activo:
          type: boolean

    UnidadNegocio:
      type: object
      properties:
        fi_unidad_negocio_id:
          type: integer
        fc_nombre:
          type: string
          maxLength: 100
        fb_activo:
          type: boolean

    MovimientoAlevines:
      type: object
      properties:
        fi_movimiento_alevines_id:
          type: integer
        fi_usuario_id:
          type: integer
        fi_alevines_id:
          type: integer
        fi_pileta_id:
          type: integer
        fi_tipo:
          type: integer
        fi_cantidad_alevines:
          type: integer
        fn_peso_promedio:
          type: number

    Alevin:
      type: object
      properties:
        fi_alevines_id:
          type: integer
        fc_numero_lote:
          type: string
        fn_peso_promedio:
          type: number
        fn_cantidad:
          type: integer
        fc_observacion:
          type: string
        fi_usuario_id:
          type: integer
        fi_colecta_id:
          type: integer

    CeibaInsumo:
      type: object
      properties:
        fi_id:
          type: integer
        fd_fecha:
          type: string
          format: date
        fc_cantidad_udm:
          type: string
        fc_num_lote:
          type: string
        fc_descripcion:
          type: string
        fc_observaciones:
          type: string
        fc_encargado_entrega:
          type: string
        fc_encargado_recepcion:
          type: string
        fi_usuario_id:
          type: integer

    BitacoraAlimentacion:
      type: object
      properties:
        fi_id:
          type: integer
        fc_mes:
          type: string
        fn_num_instalacion:
          type: number
        fn_peso_promedio_entrada:
          type: number
        fd_fecha_siembra:
          type: string
          format: date
        fc_origen_alevines:
          type: string
        fd_fecha:
          type: string
          format: date
        fn_total_alimento_kg:
          type: number
        fn_mortalidad:
          type: number
        fc_recambio_agua:
          type: string
        fn_temp_agua:
          type: number
        fn_amonio:
          type: number
        fn_ph:
          type: number
        fc_observaciones:
          type: string
        fi_usuario_id:
          type: integer

    BitacoraVisita:
      type: object
      properties:
        fi_id:
          type: integer
        fd_fecha:
          type: string
          format: date
        fc_nombre_completo:
          type: string
        fc_origen:
          type: string
        fc_motivo:
          type: string
        fc_observaciones:
          type: string
        fc_foto_identificacion:
          type: string
        fd_entrada:
          type: string
          format: date-time
        fd_salida:
          type: string
          format: date-time
        fi_usuario_id:
          type: integer
        ubicacion:
          type: string

paths:
  /roles:
    get:
      summary: "Obtener todos los roles"
      description: "Requiere token JWT + módulo /roles."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Listado de roles"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '500':
          description: "Error del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: "Crear un nuevo rol"
      description: "Requiere token JWT + módulo /roles."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
              required: [nombre]
      responses:
        '201':
          description: "Rol creado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: "Solicitud inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Error del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /roles/{id}:
    put:
      summary: "Actualizar un rol"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
      responses:
        '200':
          description: "Rol actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: "Rol no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Error del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: "Eliminar un rol"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: "Rol eliminado (sin contenido)"
        '404':
          description: "Rol no encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Error del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios/login:
    post:
      summary: "Inicio de sesión"
      description: |
        Autentica al usuario y devuelve un access token JWT junto con un refresh token.
        Rate limit: máximo 10 intentos cada 15 minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioLoginRequest'
      responses:
        '200':
          description: "Inicio de sesión exitoso"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioLoginResponse'
        '400':
          description: "Faltan datos obligatorios"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Credenciales inválidas"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Demasiados intentos de inicio de sesión"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Error del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios/refresh:
    post:
      summary: "Renovar access token"
      description: |
        Usa un refresh token válido para obtener un nuevo access token y un nuevo refresh token.
        El refresh token usado se revoca automáticamente (rotación).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: "Token renovado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: "Falta refreshToken"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Refresh token inválido o expirado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Error del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /usuarios/logout:
    post:
      summary: "Cerrar sesión"
      description: "Revoca el refresh token proporcionado. Requiere access token JWT."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: "Sesión cerrada"
          content:
            application/json:
              schema:
                type: object
                properties:
